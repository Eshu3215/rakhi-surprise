
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editable Rakhi Surprise</title>
<!-- ================= EDIT HERE ================= -->
<script>
const CONFIG={
sender:"Eswari",
receiver:"Yusuf",
introTag:"OKA CHINNA SURPRISE NA NUNCHI",
title:"Happy Rakshabandhan Gandu",
introText:"NA BANGARU KONDA KOSAM NE BANGARAM THAYARU CHESINDHI.",
finalHeading:"Mera Bhaiyya",
finalMessage:"17 years neku naku Parichayam ey ledhu. Na 18th birthday ke nenu Guntur vacha May be manam Apppude kalavali ani raasi petti undhi emo anna.Manam Kalisina roju nenu eppatiki marchipolenu netho single ga first time bayatiki vachindhi appudu ey ga AK Biryani ke I never forgot that day.First time neku Rakhi kattina roju kuda Asalu Marchipolenu Endhuku antey ah roju ey ga naku melody echi nannu mosam chesav.Urekey annanu ah roju nunchi ey mana bonda start aeindhi.Edhi kaliyugam antunnaru naku istam ledhu beacuse i want to be your sister for every life. Vache Janma lo naku ne kuthuru ga puttali ani undhi anna Inshallah.Enni godavalu vachina mana madhya entha mandhi vachina nuvu nenu eppatiki kalise undali nv undakapoina ninnu edipinchadaniki aeina nenu unta.Nuvu nenu kalisi undadam chala mandhi ke istam ledhu valla edupu kosam aeina manam kalisi undi inka edipinchali.Dheniki ey ela aeipoku repu neku inko surprise undhi.Love you Anna Happy Raksha Bandhan Anna❤️",
questions:[
["Evaru ekkuva sepu podukuntaru?","Yusuf","Eswari"],
["Evaru ekkuva Thintaru?","Yusuf","Eswari"],
["Evaru ekkuva dabbulu karchu chestharu?","Yusuf","Eswari"],
["Evariki ekkuva Badhakam?","Yusuf","Eswari"],
["Evaru first godava Padatharu?","Yusuf","Eswari"],
["Evaru first sorry cheptharu?","Yusuf","Eswari"],
["Evariki ekkuva Kopam?","Yusuf","Eswari"],
["Evaru eppudu chusina Bayata Thirugutharu?","Yusuf","Eswari"]
]
};
</script>
<!-- ============================================ -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,serif;background:linear-gradient(180deg,#fde7e5,#f5f0ff);color:#2f2342}
.screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center}
.hidden{display:none}.small{font:12px Arial;letter-spacing:4px;color:#d78c97;margin-bottom:18px}
.title{font-size:48px;line-height:1.1;margin:16px 0}.name{color:#ef6a88;font-style:italic}
.desc,.msg{font:18px Arial;color:#6f6278;line-height:1.7;max-width:340px}
.btn{margin-top:28px;border:none;background:linear-gradient(90deg,#ff7b8e,#ef5f84);color:#fff;padding:18px 42px;border-radius:999px;font:600 18px Arial;cursor:pointer}
.dots{display:flex;gap:8px;margin-bottom:14px}.dot{width:10px;height:10px;border-radius:50%;background:#ead6dd}.active{background:#ef6a88}
.qnum{font:12px Arial;letter-spacing:3px;color:#9a8fa3;margin-bottom:26px}.qtitle{font-size:38px;margin-bottom:26px}
.card{width:100%;max-width:360px;background:#ffffffb5;border-radius:24px;padding:22px;margin:12px 0;cursor:pointer;border:2px solid transparent}.card:hover{border-color:#ef6a88}
.photo{display:none;width:100%;max-width:340px;height:420px;border-radius:26px;object-fit:cover;margin-bottom:24px}
</style>
</head>
<body>
<section id=intro class=screen>
<div class=small id=introTag></div><div style="font-size:84px">🎀</div>
<div class=title><span id=title></span>,<br><span class=name id=receiver></span></div>
<div class=desc id=introText></div>
<button class=btn id=start>Open your gift</button>
<div style="margin-top:22px;font:12px Arial;letter-spacing:3px">FROM <span id=sender></span></div>
</section>

<section id=quiz class="screen hidden">
<div class=dots id=dots></div><div class=qnum id=qnum></div><div class=qtitle id=qtitle></div>
<div class=card id=op1></div><div class=card id=op2></div>
</section>

<section id=result class="screen hidden">
<div style="font-size:64px">🟣🩷</div>
<div class=small>BROTHER & SISTER FOREVER</div>
<div class=title style="font-size:40px">UNFORGETTABLE BOND,<br>officially</div>
<button class=btn id=next>There's more</button>
</section>

<section id=final class="screen hidden">
<input type=file accept="image/*" id=file><img id=img class=photo>
<div class=title style="font-size:38px" id=finalHeading></div>
<div class=msg id=finalMessage></div>
</section>

<script>
introTag.textContent=CONFIG.introTag;title.textContent=CONFIG.title;receiver.textContent=CONFIG.receiver;sender.textContent=CONFIG.sender;introText.textContent=CONFIG.introText;finalHeading.textContent=CONFIG.finalHeading;finalMessage.textContent=CONFIG.finalMessage;
let i=0;
function load(){dots.innerHTML="";for(let d=0;d<CONFIG.questions.length;d++){let e=document.createElement("div");e.className="dot"+(d<=i?" active":"");dots.appendChild(e)};qnum.textContent=`${i+1} OF ${CONFIG.questions.length}`;qtitle.textContent=CONFIG.questions[i][0];op1.textContent=CONFIG.questions[i][1];op2.textContent=CONFIG.questions[i][2]}
start.onclick=()=>{intro.classList.add("hidden");quiz.classList.remove("hidden");load()}
function pick(){i++;if(i<CONFIG.questions.length)load();else{quiz.classList.add("hidden");result.classList.remove("hidden")}}
op1.onclick=pick;op2.onclick=pick;
next.onclick=()=>{result.classList.add("hidden");final.classList.remove("hidden")}
file.onchange=e=>{let f=e.target.files[0];if(f){img.src=URL.createObjectURL(f);img.style.display="block"}}
</script>
</body></html>
