<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY RAKSHABANDHAN ANNA❤️</title>

<script>
const CONFIG={
sender:"Eswari",
receiver:"Yusuf",
introTag:"OKA CHINNA SURPRISE NA NUNCHI",
title:"Happy Rakshabandhan Gandu",
introText:"NA BANGARU KONDA KOSAM NE BANGARAM THAYARU CHESINDHI.",
finalHeading:"Mera Bhaiyya",
finalMessage:`17 years neku naku Parichayam ey ledhu. Na 18th birthday ke nenu Guntur vacha. May be manam appude kalavali ani raasi petti undhi emo anna.

Manam kalisina roju nenu eppatiki marchipolenu. Netho single ga first time bayatiki vachindhi AK Biryani ke. I never forgot that day.

First time neku Rakhi kattina roju kuda marchipolenu. Ah roju melody echi nannu mosam chesav. Urekey annanu, appati nunchi mana bonda start ayindi.

Edhi Kaliyugam antunnaru, kani naku istam ledhu because I want to be your sister for every life.

Vache janma lo naku ne kuthuru ga puttali ani undhi anna. Inshallah.

Enni godavalu vachina, entha mandhi vachina, nuvu nenu eppatiki kalise undali.

Nuvu undakapoina ninnu edipinchadaniki aina nenu unta.

Mana madhya chala mandhiki istam ledhu manam kalisi undadam. Vallaki edupu kosam aina manam kalise undali.

Dheniki ela aipoku.

Repu neku inko surprise undhi.

Love You Anna ❤️
Happy Raksha Bandhan.`,

questions:[
["Evaru ekkuva sepu podukuntaru?","Yusuf","Eswari"],
["Evaru ekkuva Thintaru?","Yusuf","Eswari"],
["Evaru ekkuva dabbulu karchu chestharu?","Yusuf","Eswari"],
["Evariki ekkuva Badhakam?","Yusuf","Eswari"],
["Evaru first godava Padatharu?","Yusuf","Eswari"],
["Evaru first sorry cheptharu?","Yusuf","Eswari"],
["Evariki ekkuva Kopam?","Yusuf","Eswari"],
["Evaru eppudu chusina Bayata Thirugutharu?","Yusuf","Eswari"]
]
};
</script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia,serif;
background:linear-gradient(180deg,#fde7e5,#f5f0ff);
color:#2f2342;
overflow-x:hidden;
}

.screen{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:28px;
text-align:center;
}

.hidden{
display:none;
}

.small{
font:12px Arial;
letter-spacing:4px;
color:#d78c97;
margin-bottom:18px;
}

.title{
font-size:48px;
line-height:1.1;
margin:16px 0;
}

.name{
color:#ef6a88;
font-style:italic;
}

.desc,.msg{
font:18px Arial;
color:#6f6278;
line-height:1.8;
max-width:340px;
white-space:pre-line;
}

.btn{
margin-top:28px;
border:none;
background:linear-gradient(90deg,#ff7b8e,#ef5f84);
color:white;
padding:18px 42px;
border-radius:999px;
font:600 18px Arial;
cursor:pointer;
box-shadow:0 10px 25px rgba(239,95,132,.35);
transition:.25s;
}

.btn:hover{
transform:scale(1.05);
}

.dots{
display:flex;
gap:8px;
margin-bottom:16px;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#ead6dd;
}

.active{
background:#ef6a88;
}

.qnum{
font:12px Arial;
letter-spacing:3px;
color:#9a8fa3;
margin-bottom:24px;
}

.qtitle{
font-size:38px;
margin-bottom:26px;
}

.card{
width:100%;
max-width:360px;
background:#ffffffb8;
border-radius:24px;
padding:22px;
margin:12px 0;
cursor:pointer;
border:2px solid transparent;
transition:.25s;
}

.card:hover{
border-color:#ef6a88;
transform:scale(1.02);
}

.photo{
width:100%;
max-width:340px;
height:440px;
object-fit:cover;
border-radius:28px;
display:block;
box-shadow:0 20px 40px rgba(0,0,0,.18);
margin-bottom:24px;
}
</style>
</head>

<body>

<!-- Intro -->

<section id="intro" class="screen">

<div class="small" id="introTag"></div>

<div style="font-size:86px;">🎀</div>

<div class="title">
<span id="title"></span><br>
<span class="name" id="receiver"></span>
</div>

<div class="desc" id="introText"></div>

<button class="btn" id="start">Open your gift</button>

<div style="margin-top:24px;font:12px Arial;letter-spacing:3px;">
FROM <span id="sender"></span>
</div>

</section>

<!-- Quiz -->

<section id="quiz" class="screen hidden">

<div class="dots" id="dots"></div>

<div class="qnum" id="qnum"></div>

<div class="qtitle" id="qtitle"></div>

<div class="card" id="op1"></div>

<div class="card" id="op2"></div>

</section>

<!-- Result -->

<section id="result" class="screen hidden">

<div style="font-size:70px;">🟣U+1F496</div>

<div class="small">UNFORGETTABLE BOND</div>

<div class="title" style="font-size:40px;">
BROTHER & SISTER,<br>FOREVER
</div>

<button class="btn" id="next">There's more</button>

</section>

<!-- Final -->

<section id="final" class="screen hidden">

<img src="us.jpg" class="photo" alt="Eswari & Yusuf">

<div class="title" style="font-size:38px;" id="finalHeading"></div>

<div class="msg" id="finalMessage"></div>

</section>

<script>

introTag.textContent=CONFIG.introTag;
title.textContent=CONFIG.title;
receiver.textContent=CONFIG.receiver;
sender.textContent=CONFIG.sender;
introText.textContent=CONFIG.introText;
finalHeading.textContent=CONFIG.finalHeading;
finalMessage.textContent=CONFIG.finalMessage;

let i=0;

function load(){

dots.innerHTML="";

for(let d=0; d<CONFIG.questions.length; d++){

let e=document.createElement("div");

e.className="dot"+(d<=i?" active":"");

dots.appendChild(e);

}

qnum.textContent=`${i+1} OF ${CONFIG.questions.length}`;

qtitle.textContent=CONFIG.questions[i][0];

op1.textContent=CONFIG.questions[i][1];

op2.textContent=CONFIG.questions[i][2];

}

start.onclick=()=>{

intro.classList.add("hidden");

quiz.classList.remove("hidden");

load();

}

function pick(){

i++;

if(i<CONFIG.questions.length){

load();

}else{

quiz.classList.add("hidden");

result.classList.remove("hidden");

}

}

op1.onclick=pick;

op2.onclick=pick;

next.onclick=()=>{

result.classList.add("hidden");

final.classList.remove("hidden");

}

</script>

</body>
</html>
